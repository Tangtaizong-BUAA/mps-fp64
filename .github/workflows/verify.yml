name: Verify benchmark catalog and packages

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Recompute benchmark tables from raw samples
        run: python tools/publish_benchmarks.py --check
      - name: Build source and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Verify packaged kernels, notices and benchmark data
        run: python tools/verify_distribution.py dist
